# The Monkey Puzzle — subpath deployment on tomspice.co.uk
#
# These are NOT a standalone file. MERGE both location blocks into the existing
# `server { server_name tomspice.co.uk; ... }` block in the live multi-tenant config
# (/etc/nginx/sites-available/donut), alongside /impala-edi-toolkit and /gecop-toolkit.
# Do NOT add a new server{} block and do NOT copy Donut's other clients' blocks here.

    location /monkey-puzzle/static/ {
        alias /opt/monkey-puzzle/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /monkey-puzzle {
        include proxy_params;
        proxy_pass http://unix:/opt/monkey-puzzle/monkeypuzzle.sock;
        proxy_read_timeout 120s;
        proxy_set_header X-Forwarded-Prefix /monkey-puzzle;
    }
