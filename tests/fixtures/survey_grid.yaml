# Fixture survey exercising the new question types added for backlog #0003:
# `triangle`, `multi_exact`, and per-audience `label_organisation` wording,
# plus the two profile_approach/profile_scope single-select questions +
# `profile_matrix` construct that replaced the old `profile_grid` question
# (backlog #0017 Part B). Small enough to drive the full step->step->result
# flow in a handful of requests.
meta:
  version: 1
  title: "Grid Fixture Survey"
  personas_count: 9

respondent_type_question: respondent_type

personas:
  accountant:
    name: "The Accountant"
    tagline: "Tagline"
    description: "Description"
  implementer:
    name: "The Implementer"
    tagline: "Tagline"
    description: "Description"
  inventor:
    name: "The Inventor"
    tagline: "Tagline"
    description: "Description"
  architect:
    name: "The Architect"
    tagline: "Tagline"
    description: "Description"
  communicator:
    name: "The Communicator"
    tagline: "Tagline"
    description: "Description"
  activist:
    name: "The Activist"
    tagline: "Tagline"
    description: "Description"
  connector:
    name: "The Connector"
    tagline: "Tagline"
    description: "Description"
  cooperator:
    name: "The Cooperator"
    tagline: "Tagline"
    description: "Description"
  entrepreneur:
    name: "The Entrepreneur"
    tagline: "Tagline"
    description: "Description"

questions:
  - id: respondent_type
    type: single
    prompt: "Are you answering as an individual, or on behalf of an organisation?"
    options:
      - { label: "As an individual", audience_value: individual }
      - { label: "On behalf of an organisation", audience_value: organisation }

  - id: q_worded
    type: single
    prompt: "Worded question"
    options:
      - { label: "I want my own answer",  label_organisation: "We want our own answer" }
      - { label: "Second option" }

  - id: q_triangle
    type: triangle
    prompt: "Pick a corner"
    options:
      - { label: "Corner A" }
      - { label: "Corner B" }
      - { label: "Corner C" }

  - id: q_multi_exact
    type: multi_exact
    choose_exactly: 2
    prompt: "Pick exactly two"
    options:
      - { label: "Item 1" }
      - { label: "Item 2" }
      - { label: "Item 3" }
      - { label: "Item 4" }

  - id: profile_approach
    type: single
    output: profile_direct
    prompt: 'Complete the following sentence: "I want to..."'
    options:
      - { label: "Create space to address the topic" }
      - { label: "Work to implement existing solutions" }
      - { label: "Test new ideas" }

  - id: profile_scope
    type: single
    output: profile_direct
    prompt: "Where do you want to focus?"
    options:
      - { label: "Within my own organisation" }
      - { label: "Collaborating within my sector" }
      - { label: "Creating impact within wider society" }

  - id: q_multi_range
    type: multi_range
    choose_min: 1
    choose_max: 3
    prompt: "Pick between one and three"
    instructions: "Choose up to 3 options."
    options:
      - { label: "Item 1" }
      - { label: "Item 2" }
      - { label: "Item 3" }
      - { label: "Item 4" }

scoring:
  method: persona_vector
  tie_break:
    - accountant
    - implementer
    - inventor
    - architect
    - communicator
    - activist
    - connector
    - cooperator
    - entrepreneur
  equity_modifier: { enabled: false }
  rogers_curve: { enabled: false }

profile_matrix:
  approach_question: profile_approach
  scope_question: profile_scope
  cells:
    - { approach: 0, scope: 0, persona: accountant }
    - { approach: 0, scope: 1, persona: communicator }
    - { approach: 0, scope: 2, persona: activist }
    - { approach: 1, scope: 0, persona: implementer }
    - { approach: 1, scope: 1, persona: entrepreneur }
    - { approach: 1, scope: 2, persona: connector }
    - { approach: 2, scope: 0, persona: inventor }
    - { approach: 2, scope: 1, persona: architect }
    - { approach: 2, scope: 2, persona: cooperator }
