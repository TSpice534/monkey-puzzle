# The Monkey Puzzle — real survey content
#
# The 11-step survey from docs/SURVEY-TEMPLATE.md, owned by Rob and Andrew.
# `personas`/`scoring` below are unchanged from the earlier placeholder
# content; only `questions:` and the new `profile_matrix` construct changed
# (backlog #0017 Part B replaced the old interactive `profile_grid` question
# with two `type: single` questions resolved via `profile_matrix`; a Part B
# follow-up tweak merges those two questions onto one combined survey step
# with a live-updating sentence and a 2x3 button grid — see
# `app/survey/loader.py::survey_steps`).

meta:
  version: 1
  title: "The Monkey Puzzle"
  personas_count: 9

# The first question routes respondents into an 'individual' or
# 'organisation' track — see the `respondent_type` question below and
# `app/survey/loader.py::effective_questions`. Its options set
# `submission.audience` instead of scoring personas. Questions tagged
# `audience: [individual]` / `[organisation]` only show on that track;
# untagged questions are shared by both.
respondent_type_question: respondent_type

# The two profile questions (`profile_approach`/`profile_scope`) jointly
# resolve the winning persona via the `profile_matrix` construct below — see
# `app/survey/persona.py::resolve_profile_persona`. They are collected on one
# combined survey step (a shared prompt, a live-updating sentence, and a 2x3
# button grid) — see `app/survey/loader.py::survey_steps`.

personas:
  accountant:
    name: "The Accountant"
    tagline: "You are the evidence!"
    icon: "icons/accountant.svg"
    description: >
      You work with numbers and data that help to tell the story of
      sustainability. Your focus is creating insight into real impact —
      reporting and measuring the data so an organisation knows what's
      actually happening, not what it hopes is happening.
    description_organisation: >
      Your organisation works with numbers and data that help to tell the
      story of sustainability. The focus is creating insight into real
      impact — reporting and measuring the data so the organisation knows
      what's actually happening, not what it hopes is happening.
    natural_allies: [communicator]
    friends: [inventor]
    necessity: [implementer]
    case_studies:
      - { title: "Placeholder case study — Accountant", url: "https://example.com/case-studies/accountant" }
    resources:
      - { title: "Placeholder resource — building a simple impact-tracking sheet", url: "https://example.com/resources/accountant-tracking" }

  implementer:
    name: "The Implementer"
    tagline: "You are the doer!"
    icon: "icons/implementer.svg"
    description: >
      You are at the frontline of implementing the changes and addressing
      the challenges that make a difference. Your focus is putting existing
      solutions to work — making an organisation more sustainable using the
      possibilities and options already available.
    description_organisation: >
      Your organisation is at the frontline of implementing changes,
      addressing challenges and making a difference. The focus is putting
      existing solutions to work — becoming more sustainable using the
      possibilities and options already available.
    natural_allies: [entrepreneur]
    friends: [accountant]
    necessity: [activist]
    case_studies:
      - { title: "Placeholder case study — Implementer", url: "https://example.com/case-studies/implementer" }
    resources:
      - { title: "Placeholder resource — a rollout checklist template", url: "https://example.com/resources/implementer-checklist" }

  inventor:
    name: "The Inventor"
    tagline: "You are the thinker!"
    icon: "icons/inventor.svg"
    description: >
      You work with difficult questions and help to develop innovative
      solutions. Your focus is innovation and new improvements — holding a
      high standard for making an organisation more sustainable and taking
      fresh steps to improve on existing options.
    description_organisation: >
      Your organisation works with difficult questions and helps to develop
      innovative solutions. The focus is innovation and new improvements —
      holding a high standard for becoming more sustainable and taking fresh
      steps to improve on existing options.
    natural_allies: [architect]
    friends: [connector]
    necessity: [implementer]
    case_studies:
      - { title: "Placeholder case study — Inventor", url: "https://example.com/case-studies/inventor" }
    resources:
      - { title: "Placeholder resource — prototyping on a small budget", url: "https://example.com/resources/inventor-prototyping" }

  architect:
    name: "The Architect"
    tagline: "You are the crowbar!"
    icon: "icons/architect.svg"
    description: >
      You open up new places, creating new spaces for conversation and
      action. Your focus is making sustainability an important topic and
      launching the initiatives that get an organisation moving.
    description_organisation: >
      Your organisation opens up new places, creating new spaces for
      conversation and action. The focus is making sustainability an
      important topic and launching the initiatives that get things moving.
    natural_allies: [communicator]
    friends: [inventor, connector]
    necessity: [cooperator]
    case_studies:
      - { title: "Placeholder case study — Architect", url: "https://example.com/case-studies/architect" }
    resources:
      - { title: "Placeholder resource — making the case internally", url: "https://example.com/resources/architect-case-making" }

  communicator:
    name: "The Communicator"
    tagline: "You are the voice!"
    icon: "icons/communicator.svg"
    description: >
      You make sure that sustainability and progress remain visible for all.
      Your focus is sharing information and sending knowledge outward —
      communicating to a larger group so the work doesn't stay hidden.
    description_organisation: >
      Your organisation makes sure that sustainability and progress remain
      visible for all. The focus is sharing information and sending knowledge
      outward — communicating to a larger group so the work doesn't stay
      hidden.
    natural_allies: [architect, accountant]
    friends: [connector, cooperator]
    necessity: [implementer]
    case_studies:
      - { title: "Placeholder case study — Communicator", url: "https://example.com/case-studies/communicator" }
    resources:
      - { title: "Placeholder resource — a simple storytelling framework", url: "https://example.com/resources/communicator-storytelling" }

  activist:
    name: "The Activist"
    tagline: "You are the disruptor!"
    icon: "icons/activist.svg"
    description: >
      You force people to have the conversations we need and make sure the
      message is heard. Your focus is creating as much push as possible for
      the cause at heart — standing firm on your ground and speaking in
      clear, strong language.
    description_organisation: >
      Your organisation forces people to have the conversations we need and
      makes sure the message is heard. The focus is creating as much push as
      possible for the cause at heart — standing firm and speaking in clear,
      strong language.
    natural_allies: [cooperator]
    friends: [connector]
    necessity: [communicator]
    case_studies:
      - { title: "Placeholder case study — Activist", url: "https://example.com/case-studies/activist" }
    resources:
      - { title: "Placeholder resource — running an effective campaign", url: "https://example.com/resources/activist-campaigns" }

  connector:
    name: "The Connector"
    tagline: "You are the gravity!"
    icon: "icons/connector.svg"
    description: >
      You see connections others don't, and you build networks from nothing.
      Your focus is creating the relationships and support systems that move
      things forward — collaboration across an organisation with an eye on
      growth within the community.
    description_organisation: >
      Your organisation creates connections others don't and builds networks
      from nothing. The focus is creating the relationships and support
      systems that move things forward — collaboration with an eye on growth
      within the community.
    natural_allies: [entrepreneur]
    friends: [cooperator]
    necessity: [communicator]
    case_studies:
      - { title: "Placeholder case study — Connector", url: "https://example.com/case-studies/connector" }
    resources:
      - { title: "Placeholder resource — building a partner network", url: "https://example.com/resources/connector-network" }

  cooperator:
    name: "The Cooperator"
    tagline: "You are the matchmaker!"
    icon: "icons/cooperator.svg"
    description: >
      You forge collaborations, make lasting connections and build teams to
      get the job done. Your focus is working together for growth on a
      specific goal — partnering beyond the organisation to create impact
      that benefits progress in a wider view.
    description_organisation: >
      Your organisation forges collaborations, makes lasting connections and
      empowers teams to get the job done. The focus is working together for
      growth on a specific goal — partnering beyond the organisation to
      create impact that benefits progress in a wider view.
    natural_allies: [connector]
    friends: [communicator]
    necessity: [inventor]
    case_studies:
      - { title: "Placeholder case study — Cooperator", url: "https://example.com/case-studies/cooperator" }
    resources:
      - { title: "Placeholder resource — running a good working group", url: "https://example.com/resources/cooperator-working-groups" }

  entrepreneur:
    name: "The Entrepreneur"
    tagline: "You are the glue!"
    icon: "icons/entrepreneur.svg"
    description: >
      You see and act upon the opportunities between business, research and
      development. Your focus is feasibility — turning an idea into a
      business, making a business of progress and finding the right
      financial market fit.
    description_organisation: >
      Your organisation sees and acts upon the opportunities between
      business, research and development. The focus is feasibility — turning
      an idea into a business, making a business of progress and finding the
      right financial market fit.
    natural_allies: [implementer, cooperator]
    friends: [communicator, architect]
    necessity: [accountant]
    case_studies:
      - { title: "Placeholder case study — Entrepreneur", url: "https://example.com/case-studies/entrepreneur" }
    resources:
      - { title: "Placeholder resource — testing an idea cheaply", url: "https://example.com/resources/entrepreneur-testing" }

questions:
  - id: respondent_type
    type: single
    prompt: "Are you answering as an individual, or on behalf of an organisation?"
    options:
      - { label: "As an individual", audience_value: individual }
      - { label: "On behalf of an organisation", audience_value: organisation }

  - id: motivation
    type: spectrum
    output: innovation_curve
    prompt: "What is your motivation to work in sustainability?"
    options:
      - { label: "I feel the need to act on this topic",     label_organisation: "We feel we must act on this topic",         score: 1 }
      - { label: "Intermediate position",                    unlabelled: true,                                                score: 2 }
      - { label: "I understand I need to act on this topic", label_organisation: "We understand we need to act on this topic", score: 3 }
      - { label: "Intermediate position",                    unlabelled: true,                                                score: 4 }
      - { label: "I do only what is asked/required",         label_organisation: "We do only what is asked/required",    score: 5 }

  - id: ambition
    type: spectrum
    output: innovation_curve
    prompt: "How ambitious are you?"
    options:
      - { label: "I want my work to be sector leading",                          label_organisation: "We want our work to be sector leading",                                    score: 1 }
      - { label: "I want to be progressive and innovative",                      label_organisation: "We want to be progressive and innovative",                                 score: 3 }
      - { label: "I want to adopt and implement the latest innovative practice", label_organisation: "We want to be adopting and implementing the latest innovative practice",    score: 5 }
      - { label: "I want to make sure I'm keeping pace with those around me",     label_organisation: "We want to make sure we're keeping pace with those around us",              score: 3 }
      - { label: "I want to get my work done",                                   label_organisation: "We want to meet our legal obligations",                                    score: 1 }

  - id: space_to_progress
    type: spectrum
    output: innovation_curve
    prompt: "What is the current balance between your commitments and capacity?"
    explanation: |-
      This question is asking you to consider how much you are currently committed, and whether you feel there is enough capacity for you / your organisation to meet those commitments.
    options:
      - { label: "Few commitments, lots of capacity",             score: 1 }
      - { label: "Some commitments, some capacity",               score: 3 }
      - { label: "Balanced between our commitments and capacity", score: 5 }
      - { label: "Little capacity, high level of commitment",     score: 3 }
      - { label: "No capacity, fully commited",                   score: 1 }

  - id: need_most
    type: triangle
    output: next
    prompt: "What do you need most to progress?"
    explanation: |-
      This question is asking you to consider your additional requirements or needs:
      - Capacity refers to skills, time and/or resources.
      - Knowledge refers to information, training and/or applied practice
      - Support refers to encouragement, space for community development and/or pathways to mastery / autonomy
    options:
      - { label: "More capacity", statement_phrase: "capacity" }
      - { label: "More knowledge", statement_phrase: "knowledge" }
      - { label: "More support", statement_phrase: "support" }

  - id: have_enough
    type: triangle
    output: now
    prompt: "What do you already have enough of?"
    explanation: |-
      This question is asking what requirements or needs you may have that are already being met:
      - Capacity refers to skills, time and/or resources.
      - Knowledge refers to information, training and/or applied practice
      - Support refers to encouragement, space for community development and/or pathways to mastery / autonomy
    options:
      - { label: "Capacity", statement_phrase: "capacity" }
      - { label: "Knowledge", statement_phrase: "knowledge" }
      - { label: "Support", statement_phrase: "support" }

  - id: profile_approach
    type: single
    output: profile_direct
    prompt: 'Complete the following sentence: "I want to..."'
    prompt_organisation: 'Complete the following sentence: "We want to..."'
    options:
      - { label: "Create space to address the topic" }
      - { label: "Work to implement existing solutions" }
      - { label: "Test new ideas" }

  - id: profile_scope
    type: single
    output: profile_direct
    prompt: "Where do you want to focus?"
    options:
      - { label: "Within my own organisation" }
      - { label: "Collaborating within my sector" }
      - { label: "Creating impact within wider society" }

  - id: topics
    type: multi_range
    choose_min: 1
    choose_max: 3
    output: now
    prompt: "Which topics do you like to focus on the most?"
    instructions: "Choose up to 3 options."
    options:
      - { label: "Water" }
      - { label: "Food & Drinks" }
      - { label: "Energy" }
      - { label: "Materials & Waste" }
      - { label: "Governance" }
      - { label: "Travel & Transport (your own and/or audience)" }
      - { label: "Positive Influence" }
      - { label: "Biodiversity & Nature" }

  - id: support_type
    type: triangle
    output: next
    prompt: "What type of assistance do you desire?"
    explanation: |-
      This question is asking you to consider what kind of assistance would help you achieve your goals:
      - Information, where you are finding/sharing appropriate knowledge
      - Training, where you are taught new information or skills
      - Mentoring, where you work in collaboration focussed on your case.
    options:
      - { label: "Information", statement_phrase: "information" }
      - { label: "Training", statement_phrase: "training" }
      - { label: "Mentoring", statement_phrase: "mentoring" }

  - id: target_groups
    type: single
    output: next
    prompt: "Who are you trying to work with?"
    options:
      - { label: "I want to engage my audience",                  label_organisation: "We want to engage our audience",                  statement_phrase: "with your audience" }
      - { label: "I want to partner with my suppliers",           label_organisation: "We want to partner with our suppliers",           statement_phrase: "with suppliers" }
      - { label: "I want to collaborate with knowledge partners", label_organisation: "We want to collaborate with knowledge partners", statement_phrase: "with knowledge partners" }
      - { label: "I want to entice policy makers",                label_organisation: "We want to entice policy makers",                 statement_phrase: "with policy makers" }
      - { label: "I want to focus on own organisation first",     label_organisation: "We want to focus on our own organisation first",  statement_phrase: "within your own organisation" }

  - id: why_reason
    type: short_text
    output: why
    prompt: "In one sentence, why is this work on this topic important to you?"

scoring:
  method: persona_vector
  tie_break:
    - accountant
    - implementer
    - inventor
    - architect
    - communicator
    - activist
    - connector
    - cooperator
    - entrepreneur
  equity_modifier: { enabled: false }
  rogers_curve: { enabled: false }

# Rogers' innovation-curve scoring (backlog #0002) — sums the `score` of the
# selected option on each `output: innovation_curve` question (motivation,
# ambition, space_to_progress), adds a persona modifier, then bands the
# total. See `app/survey/persona.py::resolve_innovation_curve`. Bands +
# colours live here (not in code) so Rob/Andrew can retune without a
# deploy; defaults chosen to sit alongside `--brand-primary` (#2e7d32).
innovation_curve:
  persona_modifiers:
    cooperator: 3
    connector: 3
    activist: 4
    architect: 3
    entrepreneur: 2
    communicator: 1
    inventor: 4
    implementer: 1
    accountant: 0
  bands:
    - name: "Laggards"
      min: 0
      max: 2
      colour: "#c0392b"   # Red
      tagline: "You are a Laggard. Wanker."
      description: >
        They are the last to adopt an innovation. Unlike some of the previous
        categories, individuals in this category show little to no opinion
        leadership. These individuals typically have an aversion to
        change-agents. Laggards typically tend to be focused on "traditions",
        lowest social status, lowest financial liquidity, oldest among
        adopters, and in contact with only family and close friends.
    - name: "Late Majority"
      min: 3
      max: 7
      colour: "#e67e22"   # Amber
      tagline: "You are in the Late Majority"
      description: >
        They adopt an innovation after the average participant. These
        individuals approach an innovation with a high degree of skepticism
        and after the majority of society has adopted the innovation. Late
        Majority are typically skeptical about an innovation, have below
        average social status, little financial liquidity, in contact with
        others in late majority and early majority and little opinion
        leadership.
    - name: "Early Majority"
      min: 8
      max: 12
      colour: "#f1c40f"   # Yellow
      tagline: "You are in the Early Majority"
      description: >
        They adopt an innovation after a varying degree of time that is
        significantly longer than the innovators and early adopters. Early
        Majority have above average social status, contact with early
        adopters and seldom hold positions of opinion leadership in a system.
    - name: "Early Adopters"
      min: 13
      max: 14
      colour: "#7cb342"   # Light Green
      tagline: "You are an Early Adopter"
      description: >
        These individuals have the highest degree of opinion leadership among
        the adopter categories. Early adopters have a higher social status,
        financial liquidity, advanced education and are more socially forward
        than late adopters. They are more discreet in adoption choices than
        innovators. They use judicious choice of adoption to help them
        maintain a central communication position.
    - name: "Innovators"
      min: 15
      max: 15
      colour: "#2e7d32"   # Green
      tagline: "You are an Innovator"
      description: >
        Innovators are willing to take risks, have the highest social status,
        have financial liquidity, are social and have closest contact to
        scientific sources and interaction with other innovators. Their risk
        tolerance allows them to adopt technologies that may ultimately fail.
        Financial resources help absorb these failures.

# Now / Next narrative statements (backlog #0007) — assembled from the
# `output: now` / `output: next` question answers by
# app/survey/persona.py::resolve_now_next. Copy lives here (not in code) so
# Rob/Andrew can edit without a deploy, same rationale as innovation_curve.
# Placeholders are question ids; each resolves to that question's selected
# option phrase(s) (see per-option `statement_phrase` below). `_organisation`
# variants are optional and fall back to the default, same pattern as
# label_organisation / description_organisation.
now_next:
  now: >-
    Your current sustainability focus is {topics}, where you feel you have a
    good amount of {have_enough} to help achieve your goals.
  next: >-
    In order to progress your ambitions, you are looking for more {need_most}.
    This could be achieved by accessing more {support_type} to address this
    challenge. In terms of collaboration ambitions, you are keen to engage more
    {target_groups}.

# Profile matrix (backlog #0017 Part B) — two single-select questions whose
# combined answers directly resolve the winning persona, replacing the old
# 3x3 grid input. `approach` = profile_approach option index (Y axis),
# `scope` = profile_scope option index (X axis). Cell->persona mapping is
# unchanged from the retired profile_grid. Used by
# app/survey/persona.py::resolve_profile_persona AND by the result-page grid
# reconstruction in app/survey/routes.py::_profile_grid_context. `prompt` and
# `sentence_stem` (Part B follow-up tweak) drive the combined survey step's
# shared legend and live-updating sentence — see
# app/templates/survey/_question_profile_pair.html.
profile_matrix:
  prompt: "Finish the following sentence..."
  sentence_stem: "I want to"
  sentence_stem_organisation: "We want to"
  approach_question: profile_approach
  scope_question: profile_scope
  cells:
    - { approach: 0, scope: 0, persona: accountant }
    - { approach: 0, scope: 1, persona: communicator }
    - { approach: 0, scope: 2, persona: activist }
    - { approach: 1, scope: 0, persona: implementer }
    - { approach: 1, scope: 1, persona: entrepreneur }
    - { approach: 1, scope: 2, persona: connector }
    - { approach: 2, scope: 0, persona: inventor }
    - { approach: 2, scope: 1, persona: architect }
    - { approach: 2, scope: 2, persona: cooperator }
