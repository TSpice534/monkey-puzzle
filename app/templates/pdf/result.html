<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>{{ persona.name }} — The Monkey Puzzle</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    @page {
      size: A4;
      margin: 1.5cm;
    }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      font-size: 0.9rem;
      font-family: Arial, Helvetica, sans-serif;
      color: #212529;
    }
    .pdf-header {
      background-color: #2e7d32;
      color: #fff;
      padding: 16px 24px;
      margin: -1.5cm -1.5cm 24px -1.5cm;
    }
    .pdf-header h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 600;
    }
    .chart-col {
      flex: 0 0 220px;
      text-align: center;
    }
    /* render_fingerprint_svg's intrinsic canvas is larger than `size` (it
       pads for rim labels) — scale it down to the column instead of
       hardcoding a smaller `size` that would shrink the label text too. */
    .chart-col svg {
      width: 100%;
      height: auto;
    }
    .results-row {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      break-inside: avoid;
    }
  </style>
</head>
<body>
  <div class="pdf-header">
    <h1>The Monkey Puzzle — Your Sustainable Who</h1>
  </div>

  <div class="results-row">
    <div class="chart-col">
      {{ fingerprint_svg | safe }}
    </div>
    <div class="flex-grow-1">
      {% include "survey/_persona_card.html" %}
    </div>
  </div>
</body>
</html>
