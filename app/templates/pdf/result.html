<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>{{ persona.name }} — The Monkey Puzzle</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    @page {
      size: A4;
      margin: 1.5cm;
    }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      font-size: 0.85rem;
      font-family: Arial, Helvetica, sans-serif;
      color: #212529;
    }
    .pdf-header {
      background-color: #2e7d32;
      color: #fff;
      padding: 16px 24px;
      margin: -1.5cm -1.5cm 14px -1.5cm;
    }
    .pdf-header h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 600;
    }
    /* Explicit sizes: Bootstrap's h3/h6 use calc()/vw values WeasyPrint renders too small,
       which left the persona name smaller than its tagline. */
    h1.h3 { font-size: 1.7rem; font-weight: 700; margin-bottom: 0.2rem; }
    .lead { font-size: 1.05rem; }
    h2.h6 { font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; }
    /* Slightly smaller chart so the innovation card can share page 1 with the persona card. */
    .innovation-curve svg { width: 40%; height: auto; }
    /* Block (not Bootstrap's flex column) so WeasyPrint sizes cards to their content. */
    .card { display: block; }
    .persona-icon { display: inline-block; line-height: 0; vertical-align: middle; }
    .persona-icon svg { display: block; width: 100%; height: 100%; }
    .persona-icon--card { width: 2.25rem; height: 2.25rem; flex: 0 0 auto; color: #2e7d32; }
    /* Hero card rules duplicated from theme.css (#0049) because WeasyPrint
       does not load theme.css. Hardcoded light values. */
    .persona-hero { background-color: rgba(46, 125, 50, 0.08); border: 1px solid #2e7d32; }
    .persona-hero .card-body { padding: 0.9rem 1rem; }
    .persona-hero p { margin-bottom: 0.5rem; }
    .persona-hero hr { margin: 0.6rem 0 !important; }
    .persona-hero .mb-3 { margin-bottom: 0.4rem !important; }
    .persona-hero__head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
    .persona-hero__eyebrow { color: #495057; }
    /* Duplicated from theme.css (backlog #0040) — this template doesn't load
       theme.css, same precedent as .persona-icon above. */
    .curve-legend-swatch {
      display: inline-block;
      width: 0.9rem;
      height: 0.9rem;
      border-radius: 0.2rem;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <div class="pdf-header">
    <h1>The Monkey Puzzle — Your Sustainable Who</h1>
  </div>

  <div>
    {% include "survey/_persona_card.html" %}
  </div>

  {% include "survey/_result_innovation.html" %}
</body>
</html>
